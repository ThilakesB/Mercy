mutation CreateCase($data: Case_Data!) @auth(level: USER) {
  case_insert(data: $data)
}

mutation UpdateCase($id: UUID!, $data: Case_Data!) @auth(level: USER) {
  case_update(id: $id, data: $data)
}

mutation DeleteCase($id: UUID!) @auth(level: USER) {
  case_delete(id: $id)
}

query GetCase($id: UUID!) @auth(level: USER) {
  case(id: $id) {
    caseNumber title status description
  }
}

query ListCases @auth(level: USER) {
  cases {
    caseNumber title status
  }
}

mutation CreateDocumentAttachment($data: DocumentAttachment_Data!) @auth(level: USER) {
  documentAttachment_insert(data: $data)
}

mutation UpdateDocumentAttachment($id: UUID!, $data: DocumentAttachment_Data!) @auth(level: USER) {
  documentAttachment_update(id: $id, data: $data)
}

mutation DeleteDocumentAttachment($id: UUID!) @auth(level: USER) {
  documentAttachment_delete(id: $id)
}

query GetDocumentAttachment($id: UUID!) @auth(level: USER) {
  documentAttachment(id: $id) {
    fileName fileUrl uploadDate
  }
}

query ListDocumentAttachments @auth(level: USER) {
  documentAttachments {
    fileName fileUrl
  }
}

