mutation UpdateJudgment($id: UUID!, $data: Judgment_Data!) @auth(level: USER) {
  judgment_update(id: $id, data: $data)
}

mutation DeleteJudgment($id: UUID!) @auth(level: USER) {
  judgment_delete(id: $id)
}

query GetJudgment($id: UUID!) @auth(level: USER) {
